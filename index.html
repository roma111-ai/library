<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Knowledge Library</title>
  <style>
    html, body { 
      margin: 0; padding: 0; overflow: hidden; background: #0e0e12; height: 100%; width: 100%;
      touch-action: none;
    }
    #app { width: 100vw; height: 100vh; }
    button {
      background: #3a2e1e; color: #e8d8a8; border: 1px solid #8b5a2b;
      padding: 8px 12px; font-family: monospace; cursor: pointer;
      font-size: 14px; border-radius: 4px;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    button:hover:not(:disabled) { background: #5a4020; }
    input, textarea { font-family: monospace; }

    /* Стили для Quill (чтобы не ломать тёмную тему) */
    #book-modal .ql-toolbar {
      background: #e0dcd0;
      border-bottom: 1px solid #5a4020;
      border-radius: 4px 4px 0 0;
      border-top: none; border-left: none; border-right: none;
    }
    #book-modal .ql-container {
      font-family: 'Times New Roman', serif;
      font-size: 16px;
      border: none;
    }
    #book-modal .ql-editor {
      padding: 20px;
      min-height: 300px;
      color: #000;
    }
    /* Возвращаем тёмный стиль инпуту названия */
    #book-modal #book-title {
      background: #2a231a !important;
      color: #e8d8a8 !important;
      border: 1px solid #5a4020 !important;
      padding: 10px !important;
    }

    /* МОБИЛЬНАЯ АДАПТАЦИЯ */
    @media (max-width: 768px) {
      #inventory-bar { height: 70px !important; padding: 0 10px !important; }
      #inventory-bar > div:nth-child(2) { gap: 6px !important; }
      #inventory-bar div[style*="width:80px"] { width: 50px !important; height: 40px !important; font-size: 8px !important; }

      #side-panel, #cart-panel {
        width: 100% !important; right: 0 !important; top: auto !important; bottom: 0 !important;
        height: 60vh !important; border-left: none !important; border-top: 2px solid #8b5a2b !important;
        border-radius: 12px 12px 0 0 !important; z-index: 4000 !important;
      }

      #desk-menu > div:first-child { flex-direction: column !important; gap: 8px !important; }
      #desk-menu > div:first-child > div:last-child { justify-content: center !important; flex-wrap: wrap !important; }
      
      #mini-map { width: 100px !important; height: 100px !important; top: 10px !important; left: 10px !important; bottom: auto !important; opacity: 0.85; }

      /* Книга на весь экран */
      #book-modal > div {
        width: 100vw !important; height: 100vh !important; max-width: none !important;
        border-radius: 0 !important; border: none !important; padding: 10px !important;
      }
      #book-modal .ql-editor { padding: 10px !important; }
      #book-modal .ql-toolbar { padding: 4px !important; }
      #book-modal .ql-toolbar .ql-formats { margin-right: 8px !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
